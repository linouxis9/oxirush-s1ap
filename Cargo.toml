[package]
name = "oxirush-s1ap"
version = "0.5.0"
edition = "2024"
description = "4G LTE/EPS S1AP between an eNB and an MME (3GPP TS 36.413, Release 19) in Rust, generated from the ASN.1: aligned PER, IEs read and built by name, message checks with their causes and JSON trees. No unsafe code."
license = "Apache-2.0"
repository = "https://github.com/linouxis9/oxirush-s1ap"
authors = ["Valentin D'Emmanuele"]
rust-version = "1.88"
keywords = ["s1ap", "lte", "epc", "mme", "3gpp"]
categories = ["network-programming", "encoding", "parser-implementations"]
readme = "README.md"
# `benches/` is a package of its own, whose files are no benchmark of the crate.
autobenches = false
include = [
    "src/**/*.rs",
    "examples/**/*.rs",
    "tests/**/*.rs",
    "tests/fixtures/*.tsv",
    "README.md",
    "CHANGELOG.md",
    "SECURITY.md",
    "LICENSE",
]

[features]
# With the register of protocols of oxirush-aper, a lock of the standard library: the
# handover containers of the other protocol of the family, whose tables a program
# registers with `inspect::register()`.
inspect = ["oxirush-aper/inspect", "oxirush-aper/std", "oxirush-utils/tree"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# One version exactly: the crate builds on the module `inspect` of oxirush-aper, which is
# hidden and changes with the two protocol crates, which are released with it in step.
oxirush-aper = "=0.3.0"
oxirush-utils = "0.2.1"

[dev-dependencies]
hex = "0.4"
# JSON as text.
serde_json = "1.0.154"
# The other protocol of the family, whose tables the tests of the handover containers
# between 5GS and EPS register.
oxirush-ngap = { version = "0.7", features = ["inspect"] }

[[example]]
name = "s1ap_build_pdu"
doc-scrape-examples = false

[[example]]
name = "s1ap_decode_manually"
doc-scrape-examples = false

[[example]]
name = "s1ap_extract_ies"
doc-scrape-examples = false

[[example]]
name = "s1ap_inspect"
required-features = ["inspect"]
doc-scrape-examples = false

# oxirush-aper at the revision whose generator wrote the bindings, whose walker reads
# and writes the trees with the table of the types, and oxirush-utils at the revision
# that the walker needs, and oxirush-ngap of the same change, whose tests take the
# handover containers of S1AP, until the releases that have them.
[patch.crates-io]
oxirush-aper = { git = "https://github.com/linouxis9/oxirush-aper", rev = "e562b89ff52003ef29a6907d9f621e155fe038f0" }
oxirush-utils = { git = "https://github.com/linouxis9/oxirush-utils", rev = "219336a848e65a19c80ef2e6bccd8feeb044844a" }
oxirush-ngap = { git = "https://github.com/linouxis9/oxirush-ngap", rev = "795510bc785a4be6f5d9ab9b4b1a0cf138cd2f20" }
